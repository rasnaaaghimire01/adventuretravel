<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <div class="logo">AdventureTravel</div>
    <div class="menu">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="ask.html">Ask Expert</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<main>
    <h1 class="page-title">Contact Us</h1>

    <form class="contact-form">
        <label for="name">Name</label>
        <input id="name" type="text" required>

        <label for="email">Email</label>
        <input id="email" type="email" required>

        <label for="message">Message</label>
        <textarea id="message" rows="4"></textarea>

        <button type="submit">Send Message</button>
    </form>

    <section class="cards">

  <section class="cards">

  <div class="card image-card">
    <img src="images/contact1.jpeg" alt="Customer Support">
    <div class="overlay"><span>24/7 Customer Support</span></div>
  </div>

  <div class="card image-card">
    <img src="images/contact2.jpg" alt="Travel Assistance">
    <div class="overlay"><span>Trusted Travel Assistance</span></div>
  </div>

  <div class="card image-card">
    <img src="images/contact3.jpeg" alt="Partnerships">
    <div class="overlay"><span>Reliable Partnerships</span></div>
  </div>

</section>


</main>

<footer>
  <section class="external-links">
    <p>For more travel information, visit:</p>

    <a href="https://www.tripadvisor.com" target="_blank" rel="noopener">
        TripAdvisor
    </a>

    <a href="https://www.travelandleisure.com" target="_blank" rel="noopener">
        Travel & Leisure
    </a>
</section>
    <p>Designed by Rasna Ghimire</p>
</footer>

</body>
</html>
